<!doctype html>
<html lang="en">
<head>
<title>FCSIT Project Library</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one idea per slide, large type, six slides for a three-minute talk. Call numbers on the title slide echo a library catalogue. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#eceff5; --ink:#121a26; --muted:#556073; --line:#d5dbe6;
  --accent:#2447c9; --accent-ink:#ffffff; --accent-soft:#e1e8ff;
  --good:#17744a; --good-soft:#dcf3e6; --warn:#9a5b00; --warn-soft:#fbecd0; --bad:#b3261e; --bad-soft:#fbe0dd;
  --f-display:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141d; --surface:#17202d; --surface2:#1f2b3b; --ink:#e8edf5; --muted:#9aa6b8; --line:#2b394c;
  --accent:#8ea8ff; --accent-ink:#0e141d; --accent-soft:#233257;
  --good:#5fd39a; --good-soft:#17382a; --warn:#f0b35a; --warn-soft:#3b2d12; --bad:#ff8f86; --bad-soft:#40201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141d; --surface:#17202d; --surface2:#1f2b3b; --ink:#e8edf5; --muted:#9aa6b8; --line:#2b394c;
  --accent:#8ea8ff; --accent-ink:#0e141d; --accent-soft:#233257;
  --good:#5fd39a; --good-soft:#17382a; --warn:#f0b35a; --warn-soft:#3b2d12; --bad:#ff8f86; --bad-soft:#40201e; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.stage{flex:1;min-height:0;overflow-y:auto;max-width:1100px;width:100%;margin:0 auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 16px;display:flex}
.slide{display:none;margin:auto 0;width:100%;flex-direction:column;gap:26px}
.slide.on{display:flex}
.eyebrow{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.slide h2{font-size:clamp(2rem,5.2vw,3.6rem);line-height:1.08;max-width:20ch}
.slide .sub{font-size:clamp(1.1rem,2vw,1.4rem);color:var(--muted);max-width:44ch}

/* slide 1 */
.title h1{font-size:clamp(2.8rem,9vw,6rem);line-height:1;max-width:12ch}
.names{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:.9rem;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}

/* big numbers */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.big{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.big b{display:block;font-family:var(--f-display);font-size:clamp(1.8rem,3.8vw,3rem);line-height:1.1;color:var(--accent);font-weight:600;word-break:break-word}
.big span{display:block;margin-top:10px;font-size:1.05rem;color:var(--muted)}
@media(max-width:760px){.trio{grid-template-columns:minmax(0,1fr)}.big b{font-size:2.8rem}}
.src{font-size:.85rem;color:var(--muted)}

/* slide 3 */
.fixgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media(max-width:820px){.fixgrid{grid-template-columns:minmax(0,1fr)}}
.probs{display:grid;gap:10px;align-content:start}
.probs button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.probs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.probs .pt{font-weight:600;font-size:1.08rem}
.probs .meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.probs .meter i{display:block;height:100%;background:var(--bad)}
.probs .ct{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.fixbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;align-content:start}
.fixbox .tag{justify-self:start;font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;background:var(--good-soft);color:var(--good);padding:3px 9px;border-radius:4px}
.fixbox h3{font-size:1.7rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 12px;font-weight:500;font-size:.95rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.chip{cursor:pointer}
.mini{width:100%;border-collapse:collapse;font-size:.92rem}
.mini th,.mini td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.mini th{color:var(--muted);font-weight:500;width:28%}
.mini thead th,.mini thead td{border-top:0;font-weight:600}
.tg{display:inline-block;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px}
.tg.cite{background:var(--accent-soft);color:var(--accent)}
.tg.award{background:var(--warn-soft);color:var(--warn)}
.tg.pick{background:var(--good-soft);color:var(--good)}
.need{font-size:.9rem;color:var(--muted)}
.need b{font-family:var(--f-display);font-size:1.5rem;color:var(--ink)}

/* slide 4 */
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chec
